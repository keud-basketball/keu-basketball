name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "Could not find the preinstalled Android sdkmanager" >&2
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          required_packages=(
            "platform-tools"
            "platforms;android-35"
            "build-tools;35.0.0"
          )
          installed_packages="$($SDKMANAGER --list_installed 2>/dev/null || true)"
          missing_packages=()
          for package in "${required_packages[@]}"; do
            if ! grep -Fq "${package}" <<< "$installed_packages"; then
              missing_packages+=("$package")
            fi
          done

          if ((${#missing_packages[@]} > 0)); then
            "$SDKMANAGER" "${missing_packages[@]}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keu-basketball-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error